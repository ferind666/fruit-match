<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水果消消乐</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f78166;
    --accent2: #d2a8ff;
    --gold: #d2991d;
    --green: #3fb950;
    --cell: #21262d;
    --cell-border: #30363d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 32px 24px 24px;
    max-width: 460px;
    width: 100%;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ── Auth ── */
  .auth-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
  }
  .auth-pill .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-weight: 500;
    font-size: 0.78rem;
  }
  .auth-pill .user-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
  }
  .pill-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.15s;
  }
  .pill-btn:hover { background: var(--cell); }
  .pill-btn.accent { border-color: var(--accent); color: var(--accent); }

  /* ── Score board ── */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .score-card .label {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 500;
  }
  .score-card .value {
    font-size: 1.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .score-card .value.score-val { color: var(--gold); }
  .score-card .value.combo-val { color: var(--accent); }

  /* ── Grid ── */
  .grid-wrap {
    position: relative;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px;
    aspect-ratio: 1;
    touch-action: none;
    cursor: grab;
  }
  .grid:active { cursor: grabbing; }

  .cell {
    background: var(--cell);
    border: 1px solid var(--cell-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 5.5vw, 2.4rem);
    position: relative;
    aspect-ratio: 1;
    transition: transform 0.1s ease, background 0.1s ease;
  }

  /* Drag highlight */
  .cell.drag-over {
    background: #2a3040;
    border-color: var(--accent);
  }

  /* Match pop */
  .cell.matched {
    animation: pop 0.3s ease forwards;
    pointer-events: none;
  }
  .cell.drop {
    animation: dropIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .cell.drop-fast {
    animation: dropIn 0.18s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    40%  { transform: scale(1.25); opacity: 0.6; }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes dropIn {
    0%   { transform: translateY(-120%); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  /* Swap animation — handled inline via JS transforms */

  /* Score float */
  .float-text {
    position: absolute;
    pointer-events: none;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--gold);
    z-index: 30;
    animation: floatUp 0.9s ease-out forwards;
    white-space: nowrap;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, 0) scale(0.7); }
    30%  { opacity: 1; transform: translate(-50%, -20px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -52px) scale(1); }
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .btn {
    flex: 1;
    padding: 12px 0;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    text-align: center;
  }
  .btn:hover { background: var(--cell); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0d1117;
  }
  .btn.primary:hover { filter: brightness(1.1); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-120%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
    z-index: 200;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.combo { border-color: var(--accent); color: var(--accent); }

  /* ── Moves counter ── */
  .moves-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 4px;
  }
  .moves-text {
    font-size: 0.82rem;
    color: var(--muted);
  }
  .moves-text b {
    color: var(--text);
    font-weight: 600;
  }
  .save-dot {
    font-size: 0.75rem;
    color: var(--muted);
    transition: color 0.3s;
  }
  .save-dot.ok { color: var(--green); }

  /* ── Modal ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px 24px 22px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal h2 {
    font-size: 1.2rem;
    font-weight: 700;
    text-align: center;
  }
  .modal .field { display: flex; flex-direction: column; gap: 4px; }
  .modal .field label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }
  .modal .field input {
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--cell);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal .field input:focus { border-color: var(--accent); }
  .modal .error { color: var(--accent); font-size: 0.82rem; text-align: center; min-height: 20px; }
  .modal .row { display: flex; gap: 10px; }
  .modal .row .btn { flex: 1; }
  .modal .switch {
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .modal .switch a {
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
  }

  /* ── Leaderboard table ── */
  .lb-wrap { max-height: 320px; overflow-y: auto; }
  .lb-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .lb-table th {
    text-align: left;
    padding: 8px 10px;
    color: var(--muted);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
  }
  .lb-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .lb-table .rk { font-weight: 700; width: 36px; }
  .lb-table .rk.top { color: var(--accent); }
  .lb-table .sc { color: var(--gold); font-weight: 600; }
  .lb-table .cb { color: var(--accent2); font-weight: 600; }

  /* ── Responsive ── */
  @media (max-width: 420px) {
    .game { padding: 20px 14px 16px; gap: 14px; }
    .grid { gap: 2px; padding: 4px; border-radius: 12px; }
    .cell { border-radius: 8px; }
    .score-card { padding: 10px 14px; }
    .score-card .value { font-size: 1.3rem; }
    .logo { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="game">
  <!-- Header -->
  <div class="header">
    <div class="logo">水果<span>消消乐</span></div>
    <div class="auth-pill" id="authPill">
      <button class="pill-btn" id="btnLogin" onclick="showAuth('login')">登录</button>
      <button class="pill-btn accent" id="btnRegister" onclick="showAuth('register')">注册</button>
      <div class="user-chip" id="userChip" style="display:none">
        <span class="dot"></span>
        <span id="displayName"></span>
        <span style="cursor:pointer;margin-left:2px" onclick="doLogout()">✕</span>
      </div>
    </div>
  </div>

  <!-- Score -->
  <div class="scoreboard">
    <div class="score-card">
      <div><div class="label">得分</div><div class="value score-val" id="scoreVal">0</div></div>
    </div>
    <div class="score-card">
      <div><div class="label">最高连击</div><div class="value combo-val" id="comboVal">0</div></div>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Moves -->
  <div class="moves-row">
    <span class="moves-text">步数 <b id="movesCount">0</b></span>
    <span class="save-dot" id="saveDot"></span>
  </div>

  <!-- Buttons -->
  <div class="bottom-bar">
    <button class="btn" id="btnHint" onclick="doHint()">💡 提示</button>
    <button class="btn" id="btnLeaderboard" onclick="showLeaderboard()">🏆 排行</button>
    <button class="btn primary" id="btnReset" onclick="doReset()">重新开始</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ══════════════════════════════════════════════════
   水果消消乐 — Swipe Edition
   ══════════════════════════════════════════════════ */

const ROWS = 8, COLS = 8;
const FRUITS = ['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍑'];
const N = FRUITS.length;
const API = '';

/* DOM */
const gridEl   = document.getElementById('grid');
const scoreEl  = document.getElementById('scoreVal');
const comboEl  = document.getElementById('comboVal');
const movesEl  = document.getElementById('movesCount');
const saveDot  = document.getElementById('saveDot');
const toastEl  = document.getElementById('toast');

/* State */
let board = [], score = 0, moves = 0, bestCombo = 0;
let busy = false;
let cells = new Map(); // "r,c" → HTMLElement

/* ═══════════════ API ═══════════════ */
function tok()  { return localStorage.getItem('fmt'); }
function user() { return localStorage.getItem('fmu'); }
function setAuth(t, u) { localStorage.setItem('fmt', t); localStorage.setItem('fmu', u); }
function clearAuth() { localStorage.removeItem('fmt'); localStorage.removeItem('fmu'); }

async function api(m, p, b) {
  const o = { method: m, headers: { 'Content-Type': 'application/json' } };
  if (tok()) o.headers['Authorization'] = 'Bearer ' + tok();
  if (b) o.body = JSON.stringify(b);
  const r = await fetch(API + '/api' + p, o);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'fail');
  return d;
}

/* ═══════════════ Auth ═══════════════ */
function showAuth(mode) {
  const isReg = mode === 'register';
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${isReg ? '创建账号' : '登录'}</h2>
        <div class="field"><label>用户名</label><input id="mu" maxlength="20" placeholder="输入用户名" autocomplete="username"></div>
        <div class="field"><label>密码</label><input id="mp" type="password" maxlength="64" placeholder="输入密码"></div>
        <div class="error" id="me"></div>
        <div class="row">
          <button class="btn primary" id="ms">${isReg ? '注册' : '登录'}</button>
          <button class="btn" onclick="closeModal()">取消</button>
        </div>
        <div class="switch">${isReg ? '已有账号？' : '没有账号？'}<a onclick="showAuth('${isReg ? 'login' : 'register'}')">${isReg ? '去登录' : '去注册'}</a></div>
      </div>
    </div>`;

  const u = document.getElementById('mu'), p = document.getElementById('mp');
  const e = document.getElementById('me'), s = document.getElementById('ms');
  u.focus();

  async function go() {
    e.textContent = '';
    if (!u.value.trim() || !p.value) { e.textContent = '请填写所有字段'; return; }
    s.disabled = true; s.textContent = '…';
    try {
      const d = await api('POST', '/auth/' + (isReg ? 'register' : 'login'), { username: u.value.trim(), password: p.value });
      setAuth(d.token, d.username);
      updateAuthUI();
      closeModal();
      // Check save
      try {
        const save = await api('GET', '/game/load');
        if (save.hasSave && confirm(`检测到存档 (${save.updatedAt})\n得分 ${save.score} · 步数 ${save.moves}\n是否恢复？`)) {
          loadFromSave(save);
        } else if (save.hasSave) {
          await api('DELETE', '/game/delete');
        }
      } catch(_){}
    } catch(x) { e.textContent = x.message; }
    s.disabled = false; s.textContent = isReg ? '注册' : '登录';
  }
  s.addEventListener('click', go);
  p.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
}

function doLogout() { clearAuth(); updateAuthUI(); }

function updateAuthUI() {
  const t = tok();
  document.getElementById('btnLogin').style.display = t ? 'none' : '';
  document.getElementById('btnRegister').style.display = t ? 'none' : '';
  document.getElementById('userChip').style.display = t ? 'flex' : 'none';
  if (t) document.getElementById('displayName').textContent = user();
}

function loadFromSave(save) {
  busy = false;
  score = save.score; moves = save.moves;
  bestCombo = save.bestCombo; board = save.board;
  scoreEl.textContent = score; movesEl.textContent = moves; comboEl.textContent = bestCombo;
  cells.clear(); gridEl.innerHTML = '';
  render();
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

/* ═══════════════ Leaderboard ═══════════════ */
async function showLeaderboard() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:440px"><h2>🏆 排行榜</h2>
        <div style="display:flex;gap:8px"><button class="btn primary" id="lbs" style="font-size:0.82rem;padding:8px 0">按得分</button><button class="btn" id="lbc" style="font-size:0.82rem;padding:8px 0">按连击</button></div>
        <div class="lb-wrap" id="lbw"><p style="text-align:center;color:var(--muted);padding:20px">加载中…</p></div>
        <button class="btn" onclick="closeModal()">关闭</button>
      </div>
    </div>`;

  async function load(sort) {
    document.getElementById('lbs').className = 'btn' + (sort === 'score' ? ' primary' : '');
    document.getElementById('lbc').className = 'btn' + (sort === 'combo' ? ' primary' : '');
    try {
      const d = await api('GET', '/leaderboard?sortBy=' + sort + '&limit=30');
      if (!d.leaderboard.length) {
        document.getElementById('lbw').innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">暂无记录</p>';
        return;
      }
      document.getElementById('lbw').innerHTML = `
        <table class="lb-table"><thead><tr><th>#</th><th>玩家</th><th>得分</th><th>连击</th><th>日期</th></tr></thead>
        <tbody>${d.leaderboard.map((r,i) => `
          <tr><td class="rk${i<3?' top':''}">${r.rank}</td><td>${esc(r.username)}</td><td class="sc">${r.score}</td><td class="cb">${r.best_combo}</td><td style="font-size:0.75rem;color:var(--muted)">${(r.played_at||'').slice(0,10)}</td></tr>`).join('')}</tbody></table>`;
    } catch(_) {
      document.getElementById('lbw').innerHTML = '<p style="text-align:center;color:var(--accent);padding:20px">加载失败</p>';
    }
  }
  document.getElementById('lbs').addEventListener('click', () => load('score'));
  document.getElementById('lbc').addEventListener('click', () => load('combo'));
  await load('score');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ═══════════════ Toast ═══════════════ */
let toastTimer;
function toast(msg, cls) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = 'toast ' + (cls || '');
  requestAnimationFrame(() => { toastEl.classList.add('show'); });
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

/* ═══════════════ Game Engine ═══════════════ */
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let f;
      do {
        f = (Math.random() * N) | 0;
      } while (
        (r >= 2 && board[r-1][c] === f && board[r-2][c] === f) ||
        (c >= 2 && board[r][c-1] === f && board[r][c-2] === f)
      );
      board[r][c] = f;
    }
  }
}

function k(r,c) { return r + ',' + c; }

function render() {
  const seen = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = k(r,c); seen.add(key);
      let el = cells.get(key);
      if (!el) {
        el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r; el.dataset.c = c;
        cells.set(key, el);
        gridEl.appendChild(el);
      }
      el.textContent = FRUITS[board[r][c]];
      el.classList.remove('drag-over');
    }
  }
  for (const [key, el] of cells) {
    if (!seen.has(key)) { el.remove(); cells.delete(key); }
  }
}

/* ═══════════════ SWIPE MECHANICS ═══════════════ */

let dragStart = null;     // { r, c, x, y }
let dragCurrent = null;   // current cell being hovered
let dragEl = null;        // the cell element being dragged
let dragOffset = { x: 0, y: 0 };

function getCellFromPoint(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || !el.dataset.r) return null;
  return { r: +el.dataset.r, c: +el.dataset.c, el };
}

gridEl.addEventListener('pointerdown', (e) => {
  if (busy) return;
  const cell = getCellFromPoint(e.clientX, e.clientY);
  if (!cell) return;
  dragStart = { r: cell.r, c: cell.c, x: e.clientX, y: e.clientY };
  dragCurrent = cell;
  dragEl = cell.el;
  dragEl.style.transition = 'none';
  gridEl.setPointerCapture(e.pointerId);
});

gridEl.addEventListener('pointermove', (e) => {
  if (!dragStart || busy) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist < 12) return; // dead zone

  // Clear previous highlight
  if (dragCurrent) dragCurrent.el.classList.remove('drag-over');

  // Determine direction
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  let tr, tc;
  if (absDx > absDy) {
    tc = dragStart.c + (dx > 0 ? 1 : -1);
    tr = dragStart.r;
  } else {
    tr = dragStart.r + (dy > 0 ? 1 : -1);
    tc = dragStart.c;
  }

  // Clamp
  if (tr < 0 || tr >= ROWS || tc < 0 || tc >= COLS) {
    // Move the cell visually with finger, clamped
    const clampX = absDx > absDy ? Math.max(-30, Math.min(30, dx)) : 0;
    const clampY = absDx <= absDy ? Math.max(-30, Math.min(30, dy)) : 0;
    dragEl.style.transform = `translate(${clampX}px, ${clampY}px)`;
    return;
  }

  dragCurrent = { r: tr, c: tc, el: cells.get(k(tr, tc)) };
  if (dragCurrent.el) dragCurrent.el.classList.add('drag-over');

  // Move cell visually
  const cellSize = gridEl.clientWidth / COLS;
  const maxMove = cellSize * 0.7;
  const moveX = absDx > absDy ? Math.max(-maxMove, Math.min(maxMove, dx)) : 0;
  const moveY = absDx <= absDy ? Math.max(-maxMove, Math.min(maxMove, dy)) : 0;
  dragEl.style.transform = `translate(${moveX}px, ${moveY}px)`;
});

gridEl.addEventListener('pointerup', (e) => {
  if (!dragStart || busy) { dragStart = null; dragCurrent = null; dragEl = null; return; }

  // Reset cell position
  if (dragEl) {
    dragEl.style.transition = 'transform 0.15s ease';
    dragEl.style.transform = '';
    setTimeout(() => { if (dragEl) { dragEl.style.transition = ''; } }, 160);
  }
  if (dragCurrent) dragCurrent.el.classList.remove('drag-over');

  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist >= 12) {
    // Swipe — determine target
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    let tr = dragStart.r, tc = dragStart.c;
    if (absDx > absDy) tc += dx > 0 ? 1 : -1;
    else tr += dy > 0 ? 1 : -1;
    if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
      doSwap(dragStart.r, dragStart.c, tr, tc);
    }
  }

  dragStart = null; dragCurrent = null; dragEl = null;
});

gridEl.addEventListener('pointercancel', () => {
  if (dragEl) { dragEl.style.transition = ''; dragEl.style.transform = ''; }
  if (dragCurrent) dragCurrent.el.classList.remove('drag-over');
  dragStart = null; dragCurrent = null; dragEl = null;
});

/* ═══════════════ Swap & Match ═══════════════ */
async function doSwap(r1, c1, r2, c2) {
  busy = true;

  // Animate
  animateSwap(r1, c1, r2, c2);
  swap(r1, c1, r2, c2);
  render();
  await sleep(160);

  const matches = findMatches();
  if (matches.size > 0) {
    moves++;
    movesEl.textContent = moves;
    await processChain(matches);
  } else {
    animateSwap(r1, c1, r2, c2);
    swap(r1, c1, r2, c2);
    render();
    await sleep(160);
  }

  busy = false;
  render();
}

function swap(r1, c1, r2, c2) {
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
}

function animateSwap(r1, c1, r2, c2) {
  const a = cells.get(k(r1, c1)), b = cells.get(k(r2, c2));
  if (!a || !b) return;
  const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
  const dx = br.left - ar.left, dy = br.top - ar.top;
  a.style.transition = 'transform 0.16s ease';
  b.style.transition = 'transform 0.16s ease';
  a.style.transform = `translate(${dx}px, ${dy}px)`;
  b.style.transform = `translate(${-dx}px, ${-dy}px)`;
  setTimeout(() => {
    a.style.transition = ''; a.style.transform = '';
    b.style.transition = ''; b.style.transform = '';
  }, 170);
}

/* ═══════════════ Match Detection ═══════════════ */
function findMatches() {
  const m = new Map();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const v = board[r][c]; if (v === -1) continue;
      let e = c; while (e+1 < COLS && board[r][e+1] === v) e++;
      if (e - c >= 2) { for (let i = c; i <= e; i++) m.set(k(r,i), true); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const v = board[r][c]; if (v === -1) continue;
      let e = r; while (e+1 < ROWS && board[e+1][c] === v) e++;
      if (e - r >= 2) { for (let i = r; i <= e; i++) m.set(k(i,c), true); }
      r = e;
    }
  }
  return m;
}

/* ═══════════════ Chain ═══════════════ */
let chainCombo = 0;

async function processChain(matches) {
  while (matches.size > 0) {
    chainCombo++;
    const pts = matches.size * 10 * chainCombo;
    score += pts;
    scoreEl.textContent = score;
    if (chainCombo > bestCombo) { bestCombo = chainCombo; comboEl.textContent = bestCombo; }
    if (chainCombo >= 2) {
      const msgs = {2:'🔥 连击!',3:'⚡ 三连击!',4:'💥 超级连击!',5:'🌟 完美连击!'};
      toast(chainCombo >= 6 ? `🌈 ${chainCombo}连击!` : (msgs[chainCombo] || `✨ ${chainCombo}连击!`), 'combo');
    }

    await animatePop(matches);
    await animateCascade();
    matches = findMatches();
  }
  chainCombo = 0;
  checkGameOver();
}

function animatePop(matches) {
  return new Promise(resolve => {
    let count = 0; let first = null;
    for (const key of matches.keys()) {
      const el = cells.get(key);
      if (el) { if (!first) first = el; el.classList.add('matched'); count++; board[parseRC(key).r][parseRC(key).c] = -1; }
    }
    if (count === 0) { resolve(); return; }
    if (first) showFloat(first, '+' + (matches.size * 10 * chainCombo));

    const h = () => { count--; if (count <= 0) { for (const key of matches.keys()) { const el = cells.get(key); if (el) el.classList.remove('matched'); } resolve(); } };
    for (const key of matches.keys()) {
      const el = cells.get(key);
      if (el) el.addEventListener('animationend', h, { once: true });
      else { count--; if (count <= 0) resolve(); }
    }
  });
}

function animateCascade() {
  return new Promise(resolve => {
    const moved = [];
    for (let c = 0; c < COLS; c++) {
      let wr = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== -1) {
          if (wr !== r) { board[wr][c] = board[r][c]; board[r][c] = -1; moved.push({ r:wr, c }); }
          wr--;
        }
      }
    }
    const filled = [];
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (board[r][c] === -1) { board[r][c] = (Math.random()*N)|0; filled.push({r,c}); }
      }
    }
    render();
    const all = [...moved, ...filled];
    if (all.length === 0) { resolve(); return; }
    all.sort((a,b) => b.r - a.r);

    let maxDelay = 0;
    for (const {r,c} of all) {
      const el = cells.get(k(r,c));
      if (el) {
        const delay = Math.min((ROWS-1-r)*18, 80);
        el.style.animationDelay = delay + 'ms';
        el.classList.add(r < 2 ? 'drop-fast' : 'drop');
        maxDelay = Math.max(maxDelay, delay);
      }
    }
    setTimeout(() => {
      for (const {r,c} of all) { const el = cells.get(k(r,c)); if (el) { el.classList.remove('drop','drop-fast'); el.style.animationDelay = ''; } }
      resolve();
    }, 280 + maxDelay);
  });
}

function parseRC(key) { const [r,c] = key.split(',').map(Number); return {r,c}; }

/* ═══════════════ Hint ═══════════════ */
function findHint() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c+1<COLS) { swap(r,c,r,c+1); const m = findMatches(); swap(r,c,r,c+1); if (m.size) return [{r,c},{r,c:c+1}]; }
      if (r+1<ROWS) { swap(r,c,r+1,c); const m = findMatches(); swap(r,c,r+1,c); if (m.size) return [{r,c},{r:r+1,c}]; }
    }
  }
  return null;
}

function doHint() {
  if (busy) return;
  const h = findHint();
  if (!h) { toast('🔀 没有可消除的了，重新洗牌！'); setTimeout(doReset, 1000); return; }
  const [a,b] = h, ea = cells.get(k(a.r,a.c)), eb = cells.get(k(b.r,b.c));
  if (!ea || !eb) return;
  let flashes = 0;
  const iv = setInterval(() => {
    if (flashes >= 6) { clearInterval(iv); ea.style.outline = eb.style.outline = ''; return; }
    ea.style.outline = eb.style.outline = flashes%2===0 ? '2px solid #d2991d' : '';
    flashes++;
  }, 180);
}

/* ═══════════════ Helpers ═══════════════ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showFloat(el, text) {
  const div = document.createElement('div');
  div.className = 'float-text'; div.textContent = text;
  const rect = el.getBoundingClientRect(), gridRect = gridEl.getBoundingClientRect();
  div.style.left = (rect.left - gridRect.left + rect.width/2) + 'px';
  div.style.top = (rect.top - gridRect.top) + 'px';
  gridEl.appendChild(div);
  div.addEventListener('animationend', () => div.remove(), { once: true });
}

/* ═══════════════ Persistence ═══════════════ */
async function saveGame() {
  if (!tok()) return;
  try {
    saveDot.textContent = '●'; saveDot.className = 'save-dot';
    await api('POST', '/game/save', { board, score, moves, combo: 0, bestCombo });
    saveDot.textContent = '✓'; saveDot.className = 'save-dot ok';
    setTimeout(() => { if (saveDot.textContent === '✓') { saveDot.textContent = ''; } }, 2000);
  } catch(_) { saveDot.textContent = ''; }
}

async function submitScore() {
  if (!tok() || (score === 0 && bestCombo === 0)) return;
  try { await api('POST', '/leaderboard/submit', { score, moves, bestCombo }); } catch(_){}
}

function checkGameOver() {
  if (!findHint()) {
    toast('🔀 没有可消除的了，重新洗牌！');
    submitScore().then(() => setTimeout(doReset, 1200));
    return;
  }
  saveGame();
}

/* ═══════════════ Reset ═══════════════ */
async function doReset() {
  await submitScore();
  busy = false;
  score = 0; moves = 0; bestCombo = 0; chainCombo = 0;
  scoreEl.textContent = '0'; movesEl.textContent = '0'; comboEl.textContent = '0';
  saveDot.textContent = '';
  cells.clear(); gridEl.innerHTML = '';
  initBoard(); render();
}

/* ═══════════════ Boot ═══════════════ */
updateAuthUI();
doReset();
if (tok()) {
  api('GET', '/game/load').then(s => {
    if (s.hasSave && confirm(`检测到存档 (${s.updatedAt})\n得分 ${s.score} · 步数 ${s.moves}\n是否恢复？`)) {
      loadFromSave(s);
    }
  }).catch(() => {});
}
