<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>水果消消乐</title>
<style>
  :root {
    --pink:   #FF6B8A;
    --peach:  #FF8E6E;
    --yellow: #FFC857;
    --mint:   #4ECDC4;
    --purple: #A78BFA;
    --accent: #FF6B8A;
    --gold:   #FF8E6E;
    --lime:   #A3E635;
    --brown:  #4A3728;
    --warm-bg: #FFF5F0;
    --card-bg: #FFFFFF;
    --cell-bg: #FFFAF7;
    --grid-bg: #FFF0E8;
    --text:   #3D2C20;
    --muted:  #A0897B;
    --border: #F0D5C8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(160deg, #FFF0E8 0%, #FFE8DC 30%, #FFF5F0 60%, #E8F8F4 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "PingFang SC", "Microsoft YaHei", "Rounded Mplus 1c", sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 28px 22px 22px;
    max-width: 440px;
    width: 100%;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 6px 4px;
  }
  .logo {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 0.01em;
    background: linear-gradient(135deg, #FF6B8A, #FF8E6E, #FFC857);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Auth ── */
  .auth-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
  }
  .auth-pill .user-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card-bg);
    border: 1.5px solid #FFD4C0;
    border-radius: 24px;
    padding: 5px 14px;
    font-weight: 600;
    font-size: 0.78rem;
    color: var(--text);
    box-shadow: 0 2px 8px rgba(255,142,110,0.1);
  }
  .auth-pill .user-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 6px rgba(78,205,196,0.5);
  }
  .pill-btn {
    background: var(--card-bg);
    border: 1.5px solid #FFD4C0;
    color: var(--text);
    border-radius: 24px;
    padding: 6px 16px;
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(255,142,110,0.08);
  }
  .pill-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,142,110,0.15);
  }
  .pill-btn.accent {
    background: linear-gradient(135deg, #FF6B8A, #FF8E6E);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 3px 12px rgba(255,107,138,0.3);
  }

  /* ── Score board ── */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }
  .score-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 3px 12px rgba(255,142,110,0.06);
  }
  .score-card .label {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .score-card .value {
    font-size: 1.7rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .score-card .value.score-val {
    background: linear-gradient(135deg, #FF8E6E, #FFC857);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .score-card .value.combo-val {
    background: linear-gradient(135deg, #FF6B8A, #A78BFA);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Grid ── */
  .grid-wrap {
    position: relative;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 4px;
    background: var(--grid-bg);
    border: 2px solid #FADDC8;
    border-radius: 20px;
    padding: 8px;
    aspect-ratio: 1;
    touch-action: none;
    cursor: grab;
    box-shadow: 0 8px 30px rgba(200,150,120,0.12), inset 0 2px 4px rgba(255,255,255,0.6);
  }
  .grid:active { cursor: grabbing; }

  .cell {
    background: linear-gradient(145deg, #FFFFFF, #FFF8F4);
    border: 1.5px solid #F8E0D0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.7rem, 5.8vw, 2.5rem);
    position: relative;
    aspect-ratio: 1;
    transition: transform 0.12s ease, background 0.12s ease, box-shadow 0.12s ease;
    will-change: auto;
    box-shadow: 0 2px 6px rgba(180,140,110,0.06);
  }

  .cell.dragging {
    will-change: transform;
    z-index: 10;
    background: linear-gradient(145deg, #FFF, #FFF3EC);
    box-shadow: 0 8px 24px rgba(255,142,110,0.2);
    border-color: #FFC4A8;
    transform: scale(1.06);
  }

  .cell.drag-over {
    background: linear-gradient(145deg, #FFF8F4, #FFEFE5);
    border-color: #FF6B8A;
    box-shadow: 0 0 0 3px rgba(255,107,138,0.15);
  }

  .cell.snap-back {
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Match pop — sparkle effect */
  .cell.matched {
    animation: pop 0.35s ease forwards;
    pointer-events: none;
  }
  .cell.drop {
    animation: dropIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .cell.drop-fast {
    animation: dropIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; filter: brightness(1); }
    30%  { transform: scale(1.3); opacity: 0.8; filter: brightness(1.4); }
    100% { transform: scale(0); opacity: 0; filter: brightness(2); }
  }
  @keyframes dropIn {
    0%   { transform: translateY(-130%) scale(0.6); opacity: 0; }
    60%  { transform: translateY(4px) scale(1.03); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }

  /* Score float */
  .float-text {
    position: absolute;
    pointer-events: none;
    font-weight: 900;
    font-size: 1.3rem;
    z-index: 30;
    animation: floatUp 0.9s ease-out forwards;
    white-space: nowrap;
    background: linear-gradient(135deg, #FF8E6E, #FFC857);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 2px 4px rgba(255,142,110,0.3));
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translate(-50%, 0) scale(0.6); }
    25%  { opacity: 1; transform: translate(-50%, -22px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -56px) scale(0.9); }
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .btn {
    flex: 1;
    padding: 13px 0;
    border-radius: 16px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    box-shadow: 0 3px 10px rgba(200,150,120,0.06);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(200,150,120,0.12);
  }
  .btn.primary {
    background: linear-gradient(135deg, #FF6B8A, #FF8E6E);
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 16px rgba(255,107,138,0.35);
  }
  .btn.primary:hover {
    box-shadow: 0 6px 22px rgba(255,107,138,0.45);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    background: var(--card-bg);
    border: 2px solid #FFD4C0;
    border-radius: 20px;
    padding: 12px 24px;
    font-weight: 800;
    font-size: 1rem;
    color: var(--text);
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 8px 30px rgba(255,142,110,0.15);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.combo {
    background: linear-gradient(135deg, #FFF0F4, #FFF5F0);
    border-color: #FF6B8A;
    color: #FF4D6A;
  }

  /* ── Moves counter ── */
  .moves-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 2px 6px;
  }
  .moves-text {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 500;
  }
  .moves-text b {
    color: var(--text);
    font-weight: 700;
    background: linear-gradient(135deg, #FF8E6E, #FFC857);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .save-dot {
    font-size: 0.75rem;
    color: var(--muted);
    transition: color 0.3s;
  }
  .save-dot.ok { color: var(--mint); }

  /* ── Modal ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(60,40,30,0.5);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--card-bg);
    border: 2px solid #FFD4C0;
    border-radius: 24px;
    padding: 28px 24px 22px;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .modal h2 {
    font-size: 1.25rem;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #FF6B8A, #FF8E6E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal .field { display: flex; flex-direction: column; gap: 4px; }
  .modal .field label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 700;
  }
  .modal .field input {
    padding: 12px 16px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: #FFFAF7;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .modal .field input:focus {
    border-color: #FF6B8A;
    box-shadow: 0 0 0 3px rgba(255,107,138,0.1);
  }
  .modal .error { color: #FF4D6A; font-size: 0.82rem; text-align: center; min-height: 20px; font-weight: 600; }
  .modal .row { display: flex; gap: 10px; }
  .modal .row .btn { flex: 1; }
  .modal .switch { text-align: center; font-size: 0.82rem; color: var(--muted); }
  .modal .switch a {
    color: #FF6B8A;
    cursor: pointer;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* ── Leaderboard table ── */
  .lb-wrap { max-height: 320px; overflow-y: auto; border-radius: 14px; }
  .lb-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  .lb-table th {
    text-align: left;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 2px solid #FADDC8;
    font-weight: 700;
  }
  .lb-table td { padding: 10px 12px; border-bottom: 1px solid #FFF0E8; }
  .lb-table tr:hover td { background: #FFFAF7; }
  .lb-table .rk { font-weight: 800; width: 36px; color: var(--muted); }
  .lb-table .rk.top {
    background: linear-gradient(135deg, #FF6B8A, #FF8E6E);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 1.1em;
  }
  .lb-table .sc {
    font-weight: 800;
    background: linear-gradient(135deg, #FF8E6E, #FFC857);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .lb-table .cb {
    font-weight: 800;
    background: linear-gradient(135deg, #FF6B8A, #A78BFA);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── Responsive ── */
  @media (max-width: 420px) {
    .game { padding: 18px 12px 14px; gap: 12px; }
    .grid { gap: 3px; padding: 5px; border-radius: 16px; }
    .cell { border-radius: 11px; }
    .score-card { padding: 12px 14px; }
    .score-card .value { font-size: 1.4rem; }
    .logo { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="game">
  <!-- Header -->
  <div class="header">
    <div class="logo">水果<span>消消乐</span></div>
    <div class="auth-pill" id="authPill">
      <button class="pill-btn" id="btnLogin" onclick="showAuth('login')">登录</button>
      <button class="pill-btn accent" id="btnRegister" onclick="showAuth('register')">注册</button>
      <div class="user-chip" id="userChip" style="display:none">
        <span class="dot"></span>
        <span id="displayName"></span>
        <span style="cursor:pointer;margin-left:2px" onclick="doLogout()">✕</span>
      </div>
    </div>
  </div>

  <!-- Score -->
  <div class="scoreboard">
    <div class="score-card">
      <div><div class="label">得分</div><div class="value score-val" id="scoreVal">0</div></div>
    </div>
    <div class="score-card">
      <div><div class="label">最高连击</div><div class="value combo-val" id="comboVal">0</div></div>
    </div>
  </div>

  <!-- Grid -->
  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <!-- Moves -->
  <div class="moves-row">
    <span class="moves-text">步数 <b id="movesCount">0</b></span>
    <span class="save-dot" id="saveDot"></span>
  </div>

  <!-- Buttons -->
  <div class="bottom-bar">
    <button class="btn" id="btnHint" onclick="doHint()">💡 提示</button>
    <button class="btn" id="btnLeaderboard" onclick="showLeaderboard()">🏆 排行</button>
    <button class="btn primary" id="btnReset" onclick="doReset()">重新开始</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
/* ══════════════════════════════════════════════════
   水果消消乐 — Swipe Edition
   ══════════════════════════════════════════════════ */

const ROWS = 8, COLS = 8;
const FRUITS = ['🍎','🍊','🍋','🍇','🍓','🍒','🥝','🍑'];
const N = FRUITS.length;
const API = '';

/* DOM */
const gridEl   = document.getElementById('grid');
const scoreEl  = document.getElementById('scoreVal');
const comboEl  = document.getElementById('comboVal');
const movesEl  = document.getElementById('movesCount');
const saveDot  = document.getElementById('saveDot');
const toastEl  = document.getElementById('toast');

/* State */
let board = [], score = 0, moves = 0, bestCombo = 0;
let busy = false;
let cells = new Map(); // "r,c" → HTMLElement

/* ═══════════════ API ═══════════════ */
function tok()  { return localStorage.getItem('fmt'); }
function user() { return localStorage.getItem('fmu'); }
function setAuth(t, u) { localStorage.setItem('fmt', t); localStorage.setItem('fmu', u); }
function clearAuth() { localStorage.removeItem('fmt'); localStorage.removeItem('fmu'); }

async function api(m, p, b) {
  const o = { method: m, headers: { 'Content-Type': 'application/json' } };
  if (tok()) o.headers['Authorization'] = 'Bearer ' + tok();
  if (b) o.body = JSON.stringify(b);
  const r = await fetch(API + '/api' + p, o);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'fail');
  return d;
}

/* ═══════════════ Auth ═══════════════ */
function showAuth(mode) {
  const isReg = mode === 'register';
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${isReg ? '创建账号' : '登录'}</h2>
        <div class="field"><label>用户名</label><input id="mu" maxlength="20" placeholder="输入用户名" autocomplete="username"></div>
        <div class="field"><label>密码</label><input id="mp" type="password" maxlength="64" placeholder="输入密码"></div>
        <div class="error" id="me"></div>
        <div class="row">
          <button class="btn primary" id="ms">${isReg ? '注册' : '登录'}</button>
          <button class="btn" onclick="closeModal()">取消</button>
        </div>
        <div class="switch">${isReg ? '已有账号？' : '没有账号？'}<a onclick="showAuth('${isReg ? 'login' : 'register'}')">${isReg ? '去登录' : '去注册'}</a></div>
      </div>
    </div>`;

  const u = document.getElementById('mu'), p = document.getElementById('mp');
  const e = document.getElementById('me'), s = document.getElementById('ms');
  u.focus();

  async function go() {
    e.textContent = '';
    if (!u.value.trim() || !p.value) { e.textContent = '请填写所有字段'; return; }
    s.disabled = true; s.textContent = '…';
    try {
      const d = await api('POST', '/auth/' + (isReg ? 'register' : 'login'), { username: u.value.trim(), password: p.value });
      setAuth(d.token, d.username);
      updateAuthUI();
      closeModal();
      // Check save
      try {
        const save = await api('GET', '/game/load');
        if (save.hasSave && confirm(`检测到存档 (${save.updatedAt})\n得分 ${save.score} · 步数 ${save.moves}\n是否恢复？`)) {
          loadFromSave(save);
        } else if (save.hasSave) {
          await api('DELETE', '/game/delete');
        }
      } catch(_){}
    } catch(x) { e.textContent = x.message; }
    s.disabled = false; s.textContent = isReg ? '注册' : '登录';
  }
  s.addEventListener('click', go);
  p.addEventListener('keydown', ev => { if (ev.key === 'Enter') go(); });
}

function doLogout() { clearAuth(); updateAuthUI(); }

function updateAuthUI() {
  const t = tok();
  document.getElementById('btnLogin').style.display = t ? 'none' : '';
  document.getElementById('btnRegister').style.display = t ? 'none' : '';
  document.getElementById('userChip').style.display = t ? 'flex' : 'none';
  if (t) document.getElementById('displayName').textContent = user();
}

function loadFromSave(save) {
  busy = false;
  score = save.score; moves = save.moves;
  bestCombo = save.bestCombo; board = save.board;
  scoreEl.textContent = score; movesEl.textContent = moves; comboEl.textContent = bestCombo;
  cells.clear(); gridEl.innerHTML = '';
  render();
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

/* ═══════════════ Leaderboard ═══════════════ */
async function showLeaderboard() {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal" style="max-width:440px"><h2>🏆 排行榜</h2>
        <div style="display:flex;gap:8px"><button class="btn primary" id="lbs" style="font-size:0.82rem;padding:8px 0">按得分</button><button class="btn" id="lbc" style="font-size:0.82rem;padding:8px 0">按连击</button></div>
        <div class="lb-wrap" id="lbw"><p style="text-align:center;color:var(--muted);padding:20px">加载中…</p></div>
        <button class="btn" onclick="closeModal()">关闭</button>
      </div>
    </div>`;

  async function load(sort) {
    document.getElementById('lbs').className = 'btn' + (sort === 'score' ? ' primary' : '');
    document.getElementById('lbc').className = 'btn' + (sort === 'combo' ? ' primary' : '');
    try {
      const d = await api('GET', '/leaderboard?sortBy=' + sort + '&limit=30');
      if (!d.leaderboard.length) {
        document.getElementById('lbw').innerHTML = '<p style="text-align:center;color:var(--muted);padding:20px">暂无记录</p>';
        return;
      }
      document.getElementById('lbw').innerHTML = `
        <table class="lb-table"><thead><tr><th>#</th><th>玩家</th><th>得分</th><th>连击</th><th>日期</th></tr></thead>
        <tbody>${d.leaderboard.map((r,i) => `
          <tr><td class="rk${i<3?' top':''}">${r.rank}</td><td>${esc(r.username)}</td><td class="sc">${r.score}</td><td class="cb">${r.best_combo}</td><td style="font-size:0.75rem;color:var(--muted)">${(r.played_at||'').slice(0,10)}</td></tr>`).join('')}</tbody></table>`;
    } catch(_) {
      document.getElementById('lbw').innerHTML = '<p style="text-align:center;color:var(--accent);padding:20px">加载失败</p>';
    }
  }
  document.getElementById('lbs').addEventListener('click', () => load('score'));
  document.getElementById('lbc').addEventListener('click', () => load('combo'));
  await load('score');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ═══════════════ Toast ═══════════════ */
let toastTimer;
function toast(msg, cls) {
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = 'toast ' + (cls || '');
  requestAnimationFrame(() => { toastEl.classList.add('show'); });
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

/* ═══════════════ Game Engine ═══════════════ */
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let f;
      do {
        f = (Math.random() * N) | 0;
      } while (
        (r >= 2 && board[r-1][c] === f && board[r-2][c] === f) ||
        (c >= 2 && board[r][c-1] === f && board[r][c-2] === f)
      );
      board[r][c] = f;
    }
  }
}

function k(r,c) { return r + ',' + c; }

function render() {
  const seen = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const key = k(r,c); seen.add(key);
      let el = cells.get(key);
      if (!el) {
        el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r; el.dataset.c = c;
        cells.set(key, el);
        gridEl.appendChild(el);
      }
      el.textContent = FRUITS[board[r][c]];
      el.classList.remove('drag-over');
    }
  }
  for (const [key, el] of cells) {
    if (!seen.has(key)) { el.remove(); cells.delete(key); }
  }
}

/* ═══════════════ SWIPE MECHANICS (optimized) ═══════════════ */

const DEAD_ZONE = 8;            // px — ignore micro-movements
const SWIPE_THRESHOLD = 0.35;   // fraction of cell size needed to trigger swap
const VELOCITY_THRESHOLD = 0.4; // px/ms — fast swipe triggers even below distance threshold

let dragStart  = null;   // { r, c, x, y, time }
let dragPrev   = null;   // previous pointer position for velocity calc
let dragEl     = null;   // cell element being dragged
let dragTarget = null;   // target cell { r, c, el } or null
let dragAxis   = null;   // 'h' | 'v' | null — locked after dead zone
let cellSize   = 0;      // cached cell pixel size

/* Cache cell size — recalculate on resize */
function updateCellSize() {
  cellSize = gridEl.clientWidth / COLS;
}
window.addEventListener('resize', updateCellSize);

function getGridCell(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el || el.dataset.r == null) return null;
  return { r: +el.dataset.r, c: +el.dataset.c, el };
}

/* Apply drag transform using translate3d for GPU acceleration */
function setDragTransform(el, x, y) {
  el.style.transform = `translate3d(${x}px,${y}px,0)`;
}

/* Snap cell back to origin with spring animation */
function snapBack(el) {
  el.classList.add('snap-back');
  el.classList.remove('dragging');
  setDragTransform(el, 0, 0);
  el.addEventListener('transitionend', function h() {
    el.removeEventListener('transitionend', h);
    el.classList.remove('snap-back');
    el.style.transform = '';
    el.style.willChange = 'auto';
  }, { once: true });
}

/* ── Pointer handlers ── */

gridEl.addEventListener('pointerdown', e => {
  if (busy) return;
  const cell = getGridCell(e.clientX, e.clientY);
  if (!cell) return;

  updateCellSize();
  dragStart  = { r: cell.r, c: cell.c, x: e.clientX, y: e.clientY, time: performance.now() };
  dragPrev   = { x: e.clientX, y: e.clientY, time: performance.now() };
  dragEl     = cell.el;
  dragTarget = null;
  dragAxis   = null;

  dragEl.classList.add('dragging');
  dragEl.style.willChange = 'transform';
  dragEl.style.transition = 'none';
  gridEl.setPointerCapture(e.pointerId);
  e.preventDefault();
});

gridEl.addEventListener('pointermove', e => {
  if (!dragStart || busy) return;

  const now = performance.now();
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const dist = Math.hypot(dx, dy);

  // Dead zone — no movement until threshold crossed
  if (dist < DEAD_ZONE) return;

  // Lock axis on first significant movement
  if (!dragAxis) {
    dragAxis = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
  }

  // Compute drag offset clamped along the locked axis
  const maxMove = cellSize * 0.65;
  let moveX = 0, moveY = 0;
  if (dragAxis === 'h') moveX = Math.max(-maxMove, Math.min(maxMove, dx));
  else                  moveY = Math.max(-maxMove, Math.min(maxMove, dy));

  // Update dragged cell position (GPU-accelerated)
  setDragTransform(dragEl, moveX, moveY);

  // Determine target cell
  let tr = dragStart.r, tc = dragStart.c;
  if (dragAxis === 'h') tc = dragStart.c + (dx > 0 ? 1 : -1);
  else                  tr = dragStart.r + (dy > 0 ? 1 : -1);

  // Clear previous target highlight
  if (dragTarget && dragTarget.el) dragTarget.el.classList.remove('drag-over');

  if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS) {
    dragTarget = { r: tr, c: tc, el: cells.get(k(tr, tc)) };
    if (dragTarget.el) dragTarget.el.classList.add('drag-over');
  } else {
    dragTarget = null;
  }

  // Track velocity
  dragPrev = { x: e.clientX, y: e.clientY, time: now };
});

gridEl.addEventListener('pointerup', e => {
  if (!dragStart || busy) { cleanup(); return; }

  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const dist = Math.hypot(dx, dy);
  const elapsed = performance.now() - dragStart.time;
  const velocity = elapsed > 0 ? dist / elapsed : 0; // px/ms

  // Clear target highlight
  if (dragTarget && dragTarget.el) dragTarget.el.classList.remove('drag-over');

  // Determine if swap should fire
  let shouldSwap = false;
  let targetR = dragStart.r, targetC = dragStart.c;

  if (dist >= cellSize * SWIPE_THRESHOLD || velocity >= VELOCITY_THRESHOLD) {
    if (dragAxis === 'h') targetC = dragStart.c + (dx > 0 ? 1 : -1);
    else                  targetR = dragStart.r + (dy > 0 ? 1 : -1);
    shouldSwap = targetR >= 0 && targetR < ROWS && targetC >= 0 && targetC < COLS;
  }

  // Animate
  if (shouldSwap) {
    // Animate the dragged cell sliding into the target position
    const targetEl = cells.get(k(targetR, targetC));
    if (targetEl) {
      const srcRect = dragEl.getBoundingClientRect();
      const tgtRect = targetEl.getBoundingClientRect();
      const tdx = tgtRect.left - srcRect.left;
      const tdy = tgtRect.top - srcRect.top;
      dragEl.style.transition = 'transform 0.12s ease-out';
      setDragTransform(dragEl, tdx, tdy);
      dragEl.addEventListener('transitionend', function h() {
        dragEl.removeEventListener('transitionend', h);
        dragEl.style.transition = '';
        dragEl.style.transform = '';
      }, { once: true });
    }
    dragEl.classList.remove('dragging');
    dragEl.style.willChange = 'auto';
    doSwap(dragStart.r, dragStart.c, targetR, targetC);
  } else {
    snapBack(dragEl);
  }

  cleanup();
});

gridEl.addEventListener('pointercancel', () => {
  if (dragEl && dragStart && !busy) snapBack(dragEl);
  if (dragTarget && dragTarget.el) dragTarget.el.classList.remove('drag-over');
  cleanup();
});

function cleanup() {
  if (dragEl) {
    dragEl.classList.remove('dragging');
    dragEl.style.willChange = 'auto';
  }
  if (dragTarget && dragTarget.el) dragTarget.el.classList.remove('drag-over');
  dragStart = dragPrev = dragEl = dragTarget = dragAxis = null;
}

/* ═══════════════ Swap & Match ═══════════════ */
async function doSwap(r1, c1, r2, c2) {
  busy = true;

  // Animate
  animateSwap(r1, c1, r2, c2);
  swap(r1, c1, r2, c2);
  render();
  await sleep(160);

  const matches = findMatches();
  if (matches.size > 0) {
    moves++;
    movesEl.textContent = moves;
    await processChain(matches);
  } else {
    animateSwap(r1, c1, r2, c2);
    swap(r1, c1, r2, c2);
    render();
    await sleep(160);
  }

  busy = false;
  render();
}

function swap(r1, c1, r2, c2) {
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
}

function animateSwap(r1, c1, r2, c2) {
  const a = cells.get(k(r1, c1)), b = cells.get(k(r2, c2));
  if (!a || !b) return;
  const ar = a.getBoundingClientRect(), br = b.getBoundingClientRect();
  const dx = br.left - ar.left, dy = br.top - ar.top;
  a.style.transition = 'transform 0.16s ease';
  b.style.transition = 'transform 0.16s ease';
  a.style.transform = `translate(${dx}px, ${dy}px)`;
  b.style.transform = `translate(${-dx}px, ${-dy}px)`;
  setTimeout(() => {
    a.style.transition = ''; a.style.transform = '';
    b.style.transition = ''; b.style.transform = '';
  }, 170);
}

/* ═══════════════ Match Detection ═══════════════ */
function findMatches() {
  const m = new Map();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const v = board[r][c]; if (v === -1) continue;
      let e = c; while (e+1 < COLS && board[r][e+1] === v) e++;
      if (e - c >= 2) { for (let i = c; i <= e; i++) m.set(k(r,i), true); }
      c = e;
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const v = board[r][c]; if (v === -1) continue;
      let e = r; while (e+1 < ROWS && board[e+1][c] === v) e++;
      if (e - r >= 2) { for (let i = r; i <= e; i++) m.set(k(i,c), true); }
      r = e;
    }
  }
  return m;
}

/* ═══════════════ Chain ═══════════════ */
let chainCombo = 0;

async function processChain(matches) {
  while (matches.size > 0) {
    chainCombo++;
    const pts = matches.size * 10 * chainCombo;
    score += pts;
    scoreEl.textContent = score;
    if (chainCombo > bestCombo) { bestCombo = chainCombo; comboEl.textContent = bestCombo; }
    if (chainCombo >= 2) {
      const msgs = {2:'🔥 连击!',3:'⚡ 三连击!',4:'💥 超级连击!',5:'🌟 完美连击!'};
      toast(chainCombo >= 6 ? `🌈 ${chainCombo}连击!` : (msgs[chainCombo] || `✨ ${chainCombo}连击!`), 'combo');
    }

    await animatePop(matches);
    await animateCascade();
    matches = findMatches();
  }
  chainCombo = 0;
  checkGameOver();
}

function animatePop(matches) {
  return new Promise(resolve => {
    let count = 0; let first = null;
    for (const key of matches.keys()) {
      const el = cells.get(key);
      if (el) { if (!first) first = el; el.classList.add('matched'); count++; board[parseRC(key).r][parseRC(key).c] = -1; }
    }
    if (count === 0) { resolve(); return; }
    if (first) showFloat(first, '+' + (matches.size * 10 * chainCombo));

    const h = () => { count--; if (count <= 0) { for (const key of matches.keys()) { const el = cells.get(key); if (el) el.classList.remove('matched'); } resolve(); } };
    for (const key of matches.keys()) {
      const el = cells.get(key);
      if (el) el.addEventListener('animationend', h, { once: true });
      else { count--; if (count <= 0) resolve(); }
    }
  });
}

function animateCascade() {
  return new Promise(resolve => {
    const moved = [];
    for (let c = 0; c < COLS; c++) {
      let wr = ROWS - 1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][c] !== -1) {
          if (wr !== r) { board[wr][c] = board[r][c]; board[r][c] = -1; moved.push({ r:wr, c }); }
          wr--;
        }
      }
    }
    const filled = [];
    for (let c = 0; c < COLS; c++) {
      for (let r = 0; r < ROWS; r++) {
        if (board[r][c] === -1) { board[r][c] = (Math.random()*N)|0; filled.push({r,c}); }
      }
    }
    render();
    const all = [...moved, ...filled];
    if (all.length === 0) { resolve(); return; }
    all.sort((a,b) => b.r - a.r);

    let maxDelay = 0;
    for (const {r,c} of all) {
      const el = cells.get(k(r,c));
      if (el) {
        const delay = Math.min((ROWS-1-r)*18, 80);
        el.style.animationDelay = delay + 'ms';
        el.classList.add(r < 2 ? 'drop-fast' : 'drop');
        maxDelay = Math.max(maxDelay, delay);
      }
    }
    setTimeout(() => {
      for (const {r,c} of all) { const el = cells.get(k(r,c)); if (el) { el.classList.remove('drop','drop-fast'); el.style.animationDelay = ''; } }
      resolve();
    }, 280 + maxDelay);
  });
}

function parseRC(key) { const [r,c] = key.split(',').map(Number); return {r,c}; }

/* ═══════════════ Hint ═══════════════ */
function findHint() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c+1<COLS) { swap(r,c,r,c+1); const m = findMatches(); swap(r,c,r,c+1); if (m.size) return [{r,c},{r,c:c+1}]; }
      if (r+1<ROWS) { swap(r,c,r+1,c); const m = findMatches(); swap(r,c,r+1,c); if (m.size) return [{r,c},{r:r+1,c}]; }
    }
  }
  return null;
}

function doHint() {
  if (busy) return;
  const h = findHint();
  if (!h) { toast('🔀 没有可消除的了，重新洗牌！'); setTimeout(doReset, 1000); return; }
  const [a,b] = h, ea = cells.get(k(a.r,a.c)), eb = cells.get(k(b.r,b.c));
  if (!ea || !eb) return;
  let flashes = 0;
  const iv = setInterval(() => {
    if (flashes >= 6) { clearInterval(iv); ea.style.outline = eb.style.outline = ''; return; }
    ea.style.outline = eb.style.outline = flashes%2===0 ? '3px solid #FF8E6E' : '';
    flashes++;
  }, 180);
}

/* ═══════════════ Helpers ═══════════════ */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showFloat(el, text) {
  const div = document.createElement('div');
  div.className = 'float-text'; div.textContent = text;
  const rect = el.getBoundingClientRect(), gridRect = gridEl.getBoundingClientRect();
  div.style.left = (rect.left - gridRect.left + rect.width/2) + 'px';
  div.style.top = (rect.top - gridRect.top) + 'px';
  gridEl.appendChild(div);
  div.addEventListener('animationend', () => div.remove(), { once: true });
}

/* ═══════════════ Persistence ═══════════════ */
async function saveGame() {
  if (!tok()) return;
  try {
    saveDot.textContent = '●'; saveDot.className = 'save-dot';
    await api('POST', '/game/save', { board, score, moves, combo: 0, bestCombo });
    saveDot.textContent = '✓'; saveDot.className = 'save-dot ok';
    setTimeout(() => { if (saveDot.textContent === '✓') { saveDot.textContent = ''; } }, 2000);
  } catch(_) { saveDot.textContent = ''; }
}

async function submitScore() {
  if (!tok() || (score === 0 && bestCombo === 0)) return;
  try { await api('POST', '/leaderboard/submit', { score, moves, bestCombo }); } catch(_){}
}

function checkGameOver() {
  if (!findHint()) {
    toast('🔀 没有可消除的了，重新洗牌！');
    submitScore().then(() => setTimeout(doReset, 1200));
    return;
  }
  saveGame();
}

/* ═══════════════ Reset ═══════════════ */
async function doReset() {
  await submitScore();
  busy = false;
  score = 0; moves = 0; bestCombo = 0; chainCombo = 0;
  scoreEl.textContent = '0'; movesEl.textContent = '0'; comboEl.textContent = '0';
  saveDot.textContent = '';
  cells.clear(); gridEl.innerHTML = '';
  initBoard(); render();
}

/* ═══════════════ Boot ═══════════════ */
updateAuthUI();
doReset();
if (tok()) {
  api('GET', '/game/load').then(s => {
    if (s.hasSave && confirm(`检测到存档 (${s.updatedAt})\n得分 ${s.score} · 步数 ${s.moves}\n是否恢复？`)) {
      loadFromSave(s);
    }
  }).catch(() => {});
}
</script>
